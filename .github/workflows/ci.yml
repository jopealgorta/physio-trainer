name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded: cancelling a push run could kill a production migration midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shared, non-secret local values. Jobs that need Supabase start it and export its keys.
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  check:
    name: Lint, typecheck, format, unit tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime
      - name: Export Supabase keys
        run: |
          pnpm exec supabase status -o env \
            | sed -n -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
                     -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the Drizzle schema
        run: pnpm db:generate && git diff --exit-code supabase/migrations
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime
      - name: Export Supabase keys
        run: |
          pnpm exec supabase status -o env \
            | sed -n -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
                     -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - run: pnpm test:int

  migrate:
    name: Apply migrations to production
    if: github.event_name == 'push'
    needs: [check, e2e, integration]
    runs-on: ubuntu-latest
    environment: production
    # Never two migrations at once. `db push` applies every pending migration in the checkout,
    # so a run dropped from the queue is covered by the next one.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      # Session pooler URL (port 5432): GitHub runners have no IPv6 and the transaction pooler
      # (6543) breaks migrations. Percent-encode the password.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pending migrations
        run: pnpm exec supabase db push --dry-run --skip-vault --db-url "$SUPABASE_DB_URL"
      - name: Apply
        run: pnpm exec supabase --yes db push --skip-vault --db-url "$SUPABASE_DB_URL"
